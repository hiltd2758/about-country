<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Guide & Battle</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="container">
        <h2>Explore Country</h2>
        <div class="search-wrapper">
            <input type="text" id="country-inp" placeholder="Enter a country name...">
            <button id="search-btn">Search</button>
        </div>
        <div id="country-info"></div>
        <button id="battle-btn" class="hidden">Battle with another country</button>
        <div id="battle-section" class="hidden">
            <input type="text" id="country-battle-inp" placeholder="Enter second country...">
            <button id="battle-start-btn">Start Battle!</button>
        </div>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
